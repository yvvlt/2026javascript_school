<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>document.write() 활용</title>
  </head>

  <body>
    <h3>document.write() 활용</h3>
    <hr />
    <script>
      document.write("<h3>Welcome!</h3>");
      document.writeln("2 + 5 는 \n");
      document.write("<mark>7 입니다.</mark><br>");
      document.write("반가워요!");
    </script>
  </body>
</html>
