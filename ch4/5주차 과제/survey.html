  </head>
  <body>
    <header>
      <h1>설문지</h1>
      <p>
        소프트웨어 기술 교육에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.
      </p>
      <hr />
    </header>

    <form>
      <fieldset>
        <legend>기본 정보</legend>

        <div>
          <h3>학년</h3>
          <label
            ><input type="radio" name="grade" value="1" checked /> 1학년</label
          >
          <label><input type="radio" name="grade" value="2" /> 2학년</label>
          <label><input type="radio" name="grade" value="3" /> 3학년</label>
          <label><input type="radio" name="grade" value="4" /> 4학년</label>
        </div>

        <div>
          <h3>성별</h3>
          <input type="radio" name="gender" value="male" checked /> 남
          <input type="radio" name="gender" value="female" /> 여
        </div>

        <label for="age">
          나이(20 ~ 30)
          <input
            type="number"
            id="age"
            name="age"
            min="20"
            max="30"
            step="1"
            required
          />
          세
        </label>

        <label for="birthdate">
          생년월일
          <input type="date" id="birthdate" name="birthdate" required />
        </label>

        <label class="satisfaction-label" for="satisfaction">
          교육 만족도
          <span>매우 불만족</span>
          <input
            type="range"
            id="satisfaction"
            name="satisfaction"
            min="1"
            max="5"
            value="3"
            step="1"
            aria-valuemin="1"
            aria-valuemax="5"
            aria-valuenow="3"
          />
          <span>매우 만족</span>
        </label>
      </fieldset>

      <section>
        <h2>추가 정보</h2>

        <label for="phone">
          *연락처
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="010-1234-5678"
            pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}"
            required
            title="010-1234-5678 형태로 입력하세요"
          />
        </label>

        <label for="email">
          *이메일
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            required
          />
        </label>

        <label for="experience">
          프로그래밍 경험
          <select id="experience" name="experience">
            <option value="none" selected>없음</option>
            <option value="under-1">1년 미만</option>
            <option value="1-3">1~3년</option>
            <option value="over-3">3년 이상</option>
          </select>
        </label>

        <fieldset>
          <legend>사용 언어</legend>
          <label class="inline-label"
            ><input type="checkbox" name="lang" value="Python" /> Python</label
          >
          <label class="inline-label"
            ><input type="checkbox" name="lang" value="Java" /> Java</label
          >
          <label class="inline-label"
            ><input type="checkbox" name="lang" value="C++" /> C++</label
          >
          <label class="inline-label"
            ><input type="checkbox" name="lang" value="JavaScript" />
            JavaScript</label
          >
          <label class="inline-label"
            ><input type="checkbox" name="lang" value="Kotlin" /> Kotlin</label
          >
        </fieldset>

        <label for="comments">
          남기고 싶은 말
          <textarea
            id="comments"
            name="comments"
            rows="5"
            cols="50"
            placeholder="의견을 자유롭게 남겨주세요"
          ></textarea>
        </label>
      </section>

      <div class="buttons">
        <button type="submit" title="제출하기">
          <img src="submit.gif" alt="제출하기" width="50" height="50" />
        </button>
        <button type="reset" title="초기화">
          <img src="reset.gif" alt="초기화" width="50" height="50" />
        </button>
      </div>
    </form>

    <footer>Copyright 2026 by Kangnam</footer>
  </body>
